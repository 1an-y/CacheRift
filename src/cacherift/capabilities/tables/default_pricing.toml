# Versioned static pricing tables (USD per 1M tokens).
# Explicitly versioned; never treat as billing invoices.

[[tables]]
pricing_table_id = "default-2026-11"
source_version = "public-list-prices-2026-11"

# OpenAI GPT-6 series, https://developers.openai.com/api/docs/pricing, checked 2026-11-26.
# Standard tier, <= 272K context (requests > 272K bill at 2x input/cached and 1.5x output).
# Optional cache write tiers (30m: 2.50 / 10.00; 12h: 5.00 / 20.00) are not emitted by
# OpenAI Responses usage today and are omitted until confirmed in live captures.
[[tables.rules]]
provider = "openai"
model_pattern = "gpt-6.1-sol"
uncached_input_per_1m = 2.00
cache_read_per_1m = 0.10
output_per_1m = 10.00

