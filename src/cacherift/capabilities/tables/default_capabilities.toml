# Versioned capability metadata (not a fallback heuristic).
# Unregistered (dialect, provider, model, gateway_profile) combinations return unknown/None.

[[capabilities]]
dialect = "openai_responses"
provider = "openai"
model_pattern = "gpt-6.2*"
gateway_profile = "*"
min_cache_tokens = 1024
ttl_semantics = "best_effort_5_10m_or_24h_retention"
ttl_seconds_hint = 300
prefix_order_note = "GPT-6.2 Responses: tools -> input -> instructions (top-level instructions are not cached across turns)"
support_level = "full"
source_version = "openai-docs-2026-11"
unit_order = ["tools", "input", "instructions"]

