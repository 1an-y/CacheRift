# Continuous integration: lint and type check, the test matrix, and the core-only isolation gate.
name: CI

# "on" is quoted because YAML 1.1 parsers read a bare `on` as the boolean true.
"on":
  push:
    branches: [main]
  pull_request:

# Every job gets read access to the checkout and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint and type check (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install '.[dev]'
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src tests

  test-matrix:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install '.[dev]'
      - name: Test
        run: pytest -v
      - name: The pytest plugin loads through its entry point where there is no conftest.py
        run: python scripts/verify_install.py plugin-entrypoint

  core-only-isolation:
    name: Core-only isolation (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # RUNNER_TEMP is set by the runner. The `runner` context itself cannot be used in a
      # job-level `env:`, so the path is spelled out where it is used.
      - name: Create a virtual environment with only the core package and pytest
        run: |
          python -m venv "$RUNNER_TEMP/cacherift-core-only"
          "$RUNNER_TEMP/cacherift-core-only/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/cacherift-core-only/bin/python" -m pip install . pytest
      - name: Verify that the core install needs neither httpx nor uvicorn
        run: |
          "$RUNNER_TEMP/cacherift-core-only/bin/python" scripts/verify_install.py core-only
