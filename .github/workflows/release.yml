# Release: build, verify and publish to PyPI through a trusted publisher.
#
# No API token is stored anywhere. Publishing needs a "Pending" Trusted Publisher registered on
# PyPI for this repository with the workflow file name `release.yml`; register one on TestPyPI as
# well to rehearse with "Run workflow". After that, pushing a tag `v<version>` releases.
name: Release

# "on" is quoted because YAML 1.1 parsers read a bare `on` as the boolean true.
"on":
  push:
    tags: ["v*"]
  # A manual run rehearses everything and publishes to TestPyPI only.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify the distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The tag, pyproject.toml and the package must agree on the version
        shell: bash
        run: |
          set -euo pipefail
          project="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          package="$(PYTHONPATH=src python -c 'import cacherift; print(cacherift.__version__)')"
          echo "tag=${GITHUB_REF_NAME} pyproject.toml=${project} cacherift.__version__=${package}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [[ "${tag}" != "${project}" || "${tag}" != "${package}" ]]; then
              echo "::error title=Version mismatch::tag ${GITHUB_REF_NAME} does not match pyproject.toml (${project}) and cacherift.__version__ (${package})"
              exit 1
            fi
          fi
          if [[ "${project}" != "${package}" ]]; then
            echo "::error title=Version mismatch::pyproject.toml (${project}) does not match cacherift.__version__ (${package})"
            exit 1
          fi
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]' build twine
      - name: Test
        run: pytest -q
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src tests
      - name: Build sdist and wheel
        run: python -m build
      - name: Check the distribution metadata
        run: twine check dist/*
      - name: The wheel and the sdist must carry the tables and the license
        run: python scripts/verify_install.py distribution dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Trusted publishing: GitHub mints a short-lived OIDC token for this job only.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish to TestPyPI (manual rehearsal)
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
      - name: Publish to PyPI (pushed v* tag)
        if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@release/v1
